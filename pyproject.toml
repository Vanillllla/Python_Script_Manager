[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Python-Script-Manager"
version = "0.1.0"
description = "Windows-first local manager for Python scripts with a web console."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ivan M" }
]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "psutil>=6.0.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.36",
  "typer>=0.12.5",
  "uvicorn>=0.32.0",
  "pywinpty>=2.0.14; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.3",
]

[project.scripts]
pysm = "pysm.cli.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysm = [
  "i18n/catalogs/*.json",
  "web/templates/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

